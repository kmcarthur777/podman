# Links shown on Homepage. Change "localhost" to your PC's hostname or IP
# (e.g. gaming-pc.lan) if you open the dashboard from another device.
# NOTE: deploy.sh only copies this file the first time. After that, edit
# ~/homelab/homepage/config/services.yaml (Homepage reloads it automatically).
- Downloads:
    - Radarr:
        href: http://localhost:7878
        description: Movies
        icon: radarr.png
    - Sonarr:
        href: http://localhost:8989
        description: TV shows
        icon: sonarr.png
    - Prowlarr:
        href: http://localhost:9696
        description: Indexers
        icon: prowlarr.png
    - qBittorrent:
        href: http://localhost:8080
        description: Download client (bound to the VPN)
        icon: qbittorrent.png
    - Bazarr:
        href: http://localhost:6767
        description: Subtitles
        icon: bazarr.png

