# Links shown on Homepage. They point at the gaming PC's LAN IP (192.168.8.249);
# give the PC a fixed/reserved IP in your router so this never changes.
# NOTE: deploy.sh only copies this file the first time. After that, edit
# ~/homelab/homepage/config/services.yaml (Homepage reloads it automatically).
- Downloads:
    - Radarr:
        href: http://192.168.8.249:7878
        description: Movies
        icon: radarr.png
    - Sonarr:
        href: http://192.168.8.249:8989
        description: TV shows
        icon: sonarr.png
    - Prowlarr:
        href: http://192.168.8.249:9696
        description: Indexers
        icon: prowlarr.png
    - qBittorrent:
        href: http://192.168.8.249:8080
        description: Download client (bound to the VPN)
        icon: qbittorrent.png
    - Bazarr:
        href: http://192.168.8.249:6767
        description: Subtitles
        icon: bazarr.png

